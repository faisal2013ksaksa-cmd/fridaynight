<!doctype html><html dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>yt test</title><style>body{font-family:sans-serif;padding:20px}.ytslot{width:100%;max-width:720px;aspect-ratio:16/9;background:#000;border-radius:16px}
.ythint{margin:0}
.ytf{position:fixed;z-index:2147483000;border-radius:16px;overflow:hidden;background:#000}
.ytf iframe,.ytf>div:first-child{position:absolute;inset:0;width:100%;height:100%;border:0}
.ytf .ytmask{position:absolute;left:0;right:0;top:0;height:24%;background:linear-gradient(#000 55%,transparent)}
.ytf .ytcover{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;background:#000e;color:#fff;font:800 20px var(--f-body,sans-serif);cursor:pointer;border:0;width:100%}
.ytf .ytcover[hidden]{display:none}
.ytf .ytcover small{font-weight:500;font-size:14px;opacity:.75}
</style></head><body>
<p>اختبار مقاطع سين جيم</p>
<div class="ytslot" data-yt="I4MCAOd-tmg|38|57"></div>
<script>window.STATES=[];/* YouTube clips: one floating player kept over the visible .ytslot, so
   re-rendering the card never restarts it. Title bar is masked, and when
   the clip reaches its end a cover hides YouTube's suggestions. */
let YTF=null,YTQ=[];
function ytAPI(cb){if(window.YT&&YT.Player){cb();return}YTQ.push(cb);if(YTQ.length>1)return;
  const prev=window.onYouTubeIframeAPIReady;window.onYouTubeIframeAPIReady=()=>{prev&&prev();const q=YTQ;YTQ=[];q.forEach(f=>f())};
  const t=document.createElement("script");t.src="https://www.youtube.com/iframe_api";document.head.appendChild(t)}
function ytKill(){if(!YTF)return;try{YTF.p&&YTF.p.destroy()}catch(e){}YTF.el.remove();YTF=null}
function ytMake(key){
  const [v,s,e]=key.split("|"),st=+s||0,en=+e||0;
  const el=document.createElement("div");el.className="ytf";
  el.innerHTML='<div></div><div class="ytmask"></div><button type="button" class="ytcover" hidden>▶ شغّل المقطع مرة ثانية<small>انتهى المقطع</small></button>';
  document.body.appendChild(el);
  const o={key,el,p:null};
  const cover=el.querySelector(".ytcover");
  cover.onclick=()=>{cover.hidden=true;try{o.p.seekTo(st,true);o.p.playVideo()}catch(x){}};
  ytAPI(()=>{if(YTF!==o)return;
    o.p=new YT.Player(el.firstChild,{videoId:v,
      playerVars:{start:st,end:en||undefined,controls:0,rel:0,modestbranding:1,playsinline:1,iv_load_policy:3,disablekb:1,fs:0,cc_load_policy:0},
      events:{onStateChange:ev=>{STATES.push(ev.data);if(ev.data===0){cover.hidden=false}}}});
    const chk=setInterval(()=>{if(YTF!==o){clearInterval(chk);return}try{if(en&&o.p.getCurrentTime&&o.p.getCurrentTime()>=en-0.15&&o.p.getPlayerState()===1){o.p.pauseVideo();cover.hidden=false}}catch(x){}},200);
  });
  return o;
}
(function ytLoop(){requestAnimationFrame(ytLoop);
  const slot=[...document.querySelectorAll(".ytslot")].find(x=>x.offsetParent!==null&&x.getClientRects().length);
  if(!slot){ytKill();return}
  const key=slot.dataset.yt;if(!YTF||YTF.key!==key){ytKill();YTF=ytMake(key)}
  const r=slot.getBoundingClientRect(),st=YTF.el.style;
  const box=`${r.left}px|${r.top}px|${r.width}px|${r.height}px`;if(YTF.box!==box){YTF.box=box;st.left=r.left+"px";st.top=r.top+"px";st.width=r.width+"px";st.height=r.height+"px"}
})();
</script></body></html>
