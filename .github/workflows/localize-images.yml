name: Localize TMDB images
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/localize_tmdb.py
      - .github/workflows/localize-images.yml
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/localize_tmdb.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A img seenjeem/index.html
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git commit -m "صور سين جيم: نزلت صور TMDB داخل مجلد img"
          git push
