name: Apply picture picks
on:
  workflow_dispatch:
  push:
    paths:
      - "picks/*.json"
permissions:
  contents: write
  pages: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python3 scripts/apply_picks.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A img seenjeem/index.html picks
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git commit -m "سين جيم: صور جديدة من صفحة اختيار الصور"
          git push
      - name: Publish the site
        run: |
          curl -sS -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
